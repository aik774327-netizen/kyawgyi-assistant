name: Unit Tests (no APK)

# Test-only workflow: compiles the app and runs unit tests WITHOUT building
# or uploading an APK artifact. Safe to run on any branch for verification.

on:
  workflow_dispatch:
  push:
    branches: [ aistudio-native-fixes-r1r2r3 ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
        timeout-minutes: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
