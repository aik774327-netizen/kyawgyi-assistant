name: Android APK Build (daily-planner-v2)

on:
  workflow_dispatch:
  push:
    branches: [ daily-planner-v2-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      # ISSUE-042: do NOT generate a fresh keystore per run. The repo pins a
      # committed TEST-ONLY debug keystore (debug.keystore, public AOSP debug
      # credentials) so every CI test APK shares one signature and installs
      # over the previous build without wiping app data.
      - name: Verify pinned debug keystore
        run: |
          test -f debug.keystore || { echo "Pinned debug.keystore missing from repo root"; exit 1; }
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        timeout-minutes: 30
      - name: Print APK signing certificate (ISSUE-042 evidence)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kyawgyi-daily-planner-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (Robolectric SDK 36 sandbox requires Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      # ISSUE-042: no per-run keystore generation (see build job). This job
      # does not sign anything; the pinned repo keystore is used as-is.
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
        timeout-minutes: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 7
