name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK (debug) with verbose Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -100
      
      - name: Find APK
        run: find build android -name "*.apk" 2>/dev/null | head -5
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kyawgyi-debug-apk
          path: "**/app-debug.apk"
          retention-days: 7
