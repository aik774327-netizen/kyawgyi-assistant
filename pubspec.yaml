name: kyawgyi_assistant
description: KyawGyi voice assistant — Flutter shell over the native bridge.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Runtime permission requests (RECORD_AUDIO before startStt).
  permission_handler: ^11.3.1
  # Gemini API voice assistant (Myanmar STT/TTS/chat).
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
